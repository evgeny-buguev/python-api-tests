[pytest]
testpaths = tests ui_tests
pythonpath = .
python_files = test_*.py
addopts = -ra --junitxml=test-results/junit.xml --strict-markers --strict-config --import-mode=importlib
markers =
    smoke: small set of critical checks
    unit: validators, API client mocks, and fixture lifecycle; no browser or network
    db: isolated in-memory SQLite checks; no browser or network
    api: requests-based checks against demo APIs
    ui: Playwright browser checks
    external: requires access to a third-party demo service

