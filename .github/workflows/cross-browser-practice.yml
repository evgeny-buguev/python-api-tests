name: Cross-browser practice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browsers
        run: python -m playwright install --with-deps chromium firefox
      - name: Run browser tests
        run: >-
          python -m pytest ui_tests/test_46_close_new_tab.py --browser chromium --browser firefox -n 2 --tracing=retain-on-failure
          --alluredir=allure-results
          --screenshot=only-on-failure
      - uses: ./.github/actions/publish-test-report
        if: always()
        with:
          name: cross-browser-report
