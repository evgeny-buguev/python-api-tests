name: UI tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: Chromium (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: local
            marker: "not external"
          - suite: external
            marker: external
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run UI suite
        run: >-
          python -m pytest ui_tests -q
          -m "${{ matrix.marker }}"
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results/browser
          --junitxml=test-results/junit-ui.xml
      - name: Upload report and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-${{ matrix.suite }}
          path: test-results/
          retention-days: 7
