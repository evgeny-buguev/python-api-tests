name: UI traces

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Record every UI test
        run: >-
          python -m pytest ui_tests -q
          --browser chromium
          --tracing on
          --screenshot only-on-failure
          --output test-results/browser
          --junitxml=test-results/junit-ui.xml
      - name: Upload report, traces, and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-traces
          path: test-results/
          retention-days: 7
