name: API tests

on:
  push:
    branches: [master]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код проекта
        uses: actions/checkout@v7

      - name: Подготовить Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Установить библиотеки
        run: python -m pip install -r requirements.txt

      - name: Запустить тесты
        run: python -m pytest test_api_post.py test_api_users.py test_db.py -v