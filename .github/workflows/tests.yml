name: API and database tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check code
        run: |
          ruff check .
          ruff format --check .
      - name: Run API and database tests
        run: python -m pytest test_api_post.py test_api_users.py test_db.py api_tests --alluredir=allure-results
      - uses: ./.github/actions/publish-test-report
        if: always()
        with:
          name: api-test-report
